<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="票据分享池：闲置票据别睡大觉，分享给需要的小伙伴，一键打包飞进邮箱～" />
  <meta name="theme-color" content="#fff7ee" />
  <title>Voucher Pool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button type="button" class="link-btn" id="backHomeBtn" aria-label="返回首页" hidden>&larr; 溜回首页</button>
    <span class="brand">票据分享池</span>
    <span class="step-label" id="stepLabel" aria-live="polite"></span>
  </header>

  <main class="container">
    <!-- 视图 1：首页 -->
    <section id="view-home" class="view">
      <div class="hero">
        <h1>票据分享池</h1>
        <p class="slogan">闲置票据别睡大觉，分享给需要的小伙伴，一键打包飞进邮箱～</p>
        <div class="big-buttons">
          <button type="button" class="big-btn share-btn" id="goShareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4" />
              <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" />
            </svg>
            <span class="big-title">我有票据要分享</span>
            <span class="big-sub">把票据文件传上来，让它跳进公共票据池～</span>
          </button>
          <button type="button" class="big-btn need-btn" id="goNeedBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <span class="big-title">我想领点票据</span>
            <span class="big-sub">智能匹配或慢慢挑，票据乖乖飞进邮箱～</span>
          </button>
        </div>
        <p class="home-stats" id="homeStats">&nbsp;</p>
      </div>
    </section>

    <!-- 视图 2：分享页 -->
    <section id="view-share" class="view" hidden>
      <h2 class="view-title">来分享票据咯~</h2>
      <form id="shareForm" class="card form-card">
        <div class="field">
          <span class="field-label">票据文件 <em>*</em></span>
          <label class="file-picker" id="filePicker" for="fileInput">
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.pdf" hidden />
            <span class="file-text" id="fileText">点一下挑票据文件呀，拖进来也行（jpg / png / webp / pdf，10MB 以内哦）</span>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">票据金额 <em>*</em></span>
            <input type="number" id="shareAmount" min="0.01" step="0.01" placeholder="比如 500" required />
          </label>
          <label class="field">
            <span class="field-label">票据类型 <em>*</em></span>
            <select id="shareType"></select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">开票年月 <em>*</em></span>
            <input type="month" id="shareMonth" required />
          </label>
          <label class="field">
            <span class="field-label">您的大名</span>
            <input type="text" id="shareName" maxlength="50" placeholder="不留也行" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">悄悄话备注</span>
          <textarea id="shareRemark" maxlength="200" rows="2" placeholder="想说什么悄悄话嘛"></textarea>
        </label>
        <button type="submit" class="primary-btn" id="shareSubmit">分享出去咯</button>
      </form>
    </section>

    <!-- 视图 3：领取页 -->
    <section id="view-claim" class="view" hidden>
      <h2 class="view-title">来领票据啦~</h2>
      <div class="subtabs" role="tablist" aria-label="领取方式">
        <button type="button" class="subtab active" id="tabManual" role="tab" aria-selected="true" aria-controls="panelManual">慢慢挑</button>
        <button type="button" class="subtab" id="tabRecommend" role="tab" aria-selected="false" aria-controls="panelRecommend">智能匹配</button>
      </div>

      <!-- 子标签 A：手动筛选 -->
      <div id="panelManual" class="panel" role="tabpanel" aria-labelledby="tabManual">
        <div class="card filter-card">
          <label class="field inline">
            <span class="field-label">金额范围</span>
            <span class="range">
              <input type="number" id="filterMin" min="0" step="0.01" placeholder="下限" />
              <span>—</span>
              <input type="number" id="filterMax" step="0.01" placeholder="上限" />
            </span>
          </label>
          <label class="field inline">
            <span class="field-label">票据类型（可多选）</span>
            <select id="filterType" multiple size="4"></select>
          </label>
          <label class="field inline">
            <span class="field-label">开票年月</span>
            <span class="range">
              <input type="month" id="filterFrom" />
              <span>—</span>
              <input type="month" id="filterTo" />
            </span>
          </label>
          <label class="field inline">
            <span class="field-label">状态</span>
            <select id="filterStatus">
              <option value="available">还在池里</option>
              <option value="claimed">已被抱走</option>
              <option value="all">全都看看</option>
            </select>
          </label>
          <div class="filter-actions">
            <button type="button" class="primary-btn" id="queryBtn">找找看</button>
            <button type="button" class="ghost-btn" id="resetBtn">清空重来</button>
          </div>
        </div>
        <div id="manualList" class="card-list"></div>
      </div>

      <!-- 子标签 B：智能推荐 -->
      <div id="panelRecommend" class="panel" role="tabpanel" aria-labelledby="tabRecommend" hidden>
        <div class="card filter-card">
          <label class="field inline">
            <span class="field-label">想要的金额 <em>*</em></span>
            <input type="number" id="needAmount" min="0.01" step="0.01" placeholder="比如 5000" />
          </label>
          <label class="field inline">
            <span class="field-label">票据类型</span>
            <select id="needType"></select>
          </label>
          <button type="button" class="primary-btn" id="matchBtn">帮我去匹配</button>
        </div>
        <div id="recommendResult" hidden>
          <p class="notice warn" id="recommendNotice" hidden></p>
          <div id="recommendList" class="card-list"></div>
          <div class="card summary-bar" id="recommendSummaryBar">
            <span id="recommendSummary"></span>
            <button type="button" class="primary-btn" id="claimRecommendBtn" disabled>选中的寄给我</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 领取邮箱弹窗 -->
  <div class="modal-mask" id="claimModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="claimModalTitle">
      <h3 id="claimModalTitle">把票据寄到邮箱咯</h3>
      <p class="modal-tip">票据文件马上打包寄给您，领走就立刻锁定啦，邮箱千万别写错哦～</p>
      <label class="field">
        <span class="field-label">邮箱地址 <em>*</em></span>
        <input type="email" id="claimEmail" placeholder="比如 name@example.com，别写错哦" />
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="claimCancel">再想想</button>
        <button type="button" class="primary-btn" id="claimConfirm">寄给我</button>
      </div>
    </div>
  </div>

  <!-- 访问小暗号弹窗（服务端配置 ACCESS_TOKEN 后启用） -->
  <div class="modal-mask" id="tokenModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenModalTitle">
      <h3 id="tokenModalTitle">进门小暗号</h3>
      <p class="modal-tip">这里上了小锁呢，悄悄输入访问小暗号就能进。暗号会记在本机浏览器里，下次自动带上来哦～</p>
      <label class="field">
        <span class="field-label">访问小暗号 <em>*</em></span>
        <input type="password" id="tokenInput" placeholder="悄悄输入小暗号" />
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="tokenCancel">再想想</button>
        <button type="button" class="primary-btn" id="tokenConfirm">开门</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
