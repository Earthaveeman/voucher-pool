<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="票据分享池：闲置票据别睡大觉，分享给需要的小伙伴，一键打包飞进邮箱～" />
  <meta name="theme-color" content="#fff7ee" />
  <title>Voucher Pool</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button type="button" class="link-btn" id="backHomeBtn" aria-label="返回首页" hidden>&larr; 溜回首页</button>
    <span class="brand">票据分享池</span>
    <span class="step-label" id="stepLabel" aria-live="polite"></span>
  </header>

  <main class="container">
    <!-- 视图 1：首页 -->
    <section id="view-home" class="view">
      <div class="hero">
        <h1>票据分享池</h1>
        <p class="slogan">闲置票据别睡大觉，分享给需要的小伙伴，一键打包飞进邮箱～</p>
        <div class="mascot-wrap">
          <div class="mascot-bubble" id="mascotBubble" role="status" hidden></div>
          <svg id="mascot" class="mascot" viewBox="0 0 140 138" role="img" data-state="idle"
            aria-label="袋鼠吉祥物，目光和小脑袋会一起追看鼠标，点它会跳起来打招呼">
            <defs>
              <linearGradient id="kgBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#cd8250" />
                <stop offset="0.55" stop-color="#bc6b3c" />
                <stop offset="1" stop-color="#a6562d" />
              </linearGradient>
              <linearGradient id="kgBelly" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fdf2e4" />
                <stop offset="1" stop-color="#f5dfc2" />
              </linearGradient>
              <linearGradient id="kgInnerEar" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e9b6a6" />
                <stop offset="1" stop-color="#d89a88" />
              </linearGradient>
              <linearGradient id="kgFoot" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b06033" />
                <stop offset="1" stop-color="#8f4a24" />
              </linearGradient>
              <radialGradient id="kgBlush">
                <stop offset="0" stop-color="#f0a48e" stop-opacity="0.9" />
                <stop offset="1" stop-color="#f0a48e" stop-opacity="0" />
              </radialGradient>
              <clipPath id="kgBodyClip">
                <ellipse cx="62" cy="85" rx="30" ry="35" />
              </clipPath>
            </defs>
            <!-- 地面柔影（随弹跳同步缩放） -->
            <ellipse class="shadow" cx="62" cy="129" rx="36" ry="6.5" fill="#a5744a" opacity="0.22" />
            <!-- 粗尾巴（向后撑地，待机轻摆） -->
            <g class="tail">
              <path d="M88 92 Q118 100 126 122" stroke="url(#kgBody)" stroke-width="11" stroke-linecap="round" fill="none" />
              <circle cx="126" cy="122" r="5.5" fill="url(#kgFoot)" />
            </g>
            <!-- 强壮的大脚 -->
            <ellipse cx="43" cy="120" rx="17" ry="7" fill="url(#kgFoot)" />
            <ellipse cx="81" cy="120" rx="17" ry="7" fill="url(#kgFoot)" />
            <!-- 圆润梨形身体：奶油肚皮 + 底部柔和阴影 + 顶部受光 -->
            <ellipse cx="62" cy="85" rx="30" ry="35" fill="url(#kgBody)" />
            <g clip-path="url(#kgBodyClip)">
              <ellipse cx="62" cy="116" rx="26" ry="10" fill="#8f4a24" opacity="0.16" />
              <ellipse cx="62" cy="58" rx="24" ry="9" fill="#fff" opacity="0.14" />
            </g>
            <ellipse cx="62" cy="91" rx="18.5" ry="23" fill="url(#kgBelly)" />
            <!-- 头部投影：增强头身层次 -->
            <ellipse cx="62" cy="63" rx="14" ry="4" fill="#8f4a24" opacity="0.18" />
            <!-- 短小手 -->
            <ellipse class="paw paw-l" cx="34.5" cy="75" rx="5.5" ry="10" fill="url(#kgBody)" />
            <ellipse class="paw paw-r" cx="89.5" cy="75" rx="5.5" ry="10" fill="url(#kgBody)" />
            <!-- 育儿袋里的小袋鼠（好奇/探头时上移） -->
            <g class="joey">
              <ellipse cx="57" cy="70" rx="2.6" ry="5" fill="#bc6b3c" transform="rotate(-14 57 70)" />
              <ellipse cx="67" cy="70" rx="2.6" ry="5" fill="#bc6b3c" transform="rotate(14 67 70)" />
              <circle cx="62" cy="77" r="7" fill="url(#kgBody)" />
              <circle cx="59.5" cy="76" r="1.3" fill="#4a3f55" />
              <circle cx="64.5" cy="76" r="1.3" fill="#4a3f55" />
              <circle cx="62" cy="79.6" r="1.2" fill="#6b3d1e" />
            </g>
            <!-- 育儿袋开口 -->
            <path d="M48 85 Q62 100 76 85" stroke="#8a4a24" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <!-- 头部整体（耳朵 + 五官），JS 驱动 CSS 变量做阻尼跟随转动 -->
            <g class="head">
              <!-- 标志性长耳朵（好奇竖起、失落耷拉、随机抖动） -->
              <g class="ear ear-l">
                <ellipse cx="47" cy="14" rx="6.5" ry="17" fill="url(#kgBody)" />
                <ellipse cx="47" cy="16.5" rx="3" ry="10.5" fill="url(#kgInnerEar)" />
              </g>
              <g class="ear ear-r">
                <ellipse cx="77" cy="14" rx="6.5" ry="17" fill="url(#kgBody)" />
                <ellipse cx="77" cy="16.5" rx="3" ry="10.5" fill="url(#kgInnerEar)" />
              </g>
              <!-- 圆润大脑袋与细腻头顶高光 -->
              <circle cx="62" cy="40" r="22" fill="url(#kgBody)" />
              <ellipse cx="51" cy="25" rx="9.5" ry="4.5" fill="#fff" opacity="0.38" transform="rotate(-30 51 25)" />
              <ellipse cx="74" cy="30" rx="4" ry="2" fill="#fff" opacity="0.2" transform="rotate(28 74 30)" />
              <!-- 柔和吻部 -->
              <ellipse cx="62" cy="49" rx="12.5" ry="9.5" fill="url(#kgBelly)" />
              <!-- 腮红柔光 -->
              <ellipse cx="41" cy="48.5" rx="6.5" ry="5" fill="url(#kgBlush)" />
              <ellipse cx="83" cy="48.5" rx="6.5" ry="5" fill="url(#kgBlush)" />
              <!-- 眼睛（眼白 + 双高光瞳孔 + 失落眼皮 + 泪珠） -->
              <g class="eye">
                <circle cx="52" cy="38" r="7.5" fill="#fffdf8" />
                <g class="pupil">
                  <circle cx="52" cy="38" r="3.6" fill="#4a3f55" />
                  <circle cx="50.9" cy="36.8" r="1.3" fill="#fff" />
                  <circle cx="53.4" cy="39.4" r="0.7" fill="#fff" opacity="0.8" />
                </g>
                <path class="eyelid" d="M44.5 38 A7.5 7.5 0 0 1 59.5 38 Z" fill="#b56a3e" />
                <path class="tear" d="M45.5 42.5 C43 46 43.6 48.6 45.5 49.4 C47.4 48.6 48 46 45.5 42.5 Z" fill="#9ed4f2" />
              </g>
              <g class="eye">
                <circle cx="72" cy="38" r="7.5" fill="#fffdf8" />
                <g class="pupil">
                  <circle cx="72" cy="38" r="3.6" fill="#4a3f55" />
                  <circle cx="70.9" cy="36.8" r="1.3" fill="#fff" />
                  <circle cx="73.4" cy="39.4" r="0.7" fill="#fff" opacity="0.8" />
                </g>
                <path class="eyelid" d="M64.5 38 A7.5 7.5 0 0 1 79.5 38 Z" fill="#b56a3e" />
              </g>
              <!-- 生气眉（默认隐藏） -->
              <path class="brow" d="M45.5 27.5 L58 32" stroke="#6b3d1e" stroke-width="2.4" stroke-linecap="round" />
              <path class="brow" d="M78.5 27.5 L66 32" stroke="#6b3d1e" stroke-width="2.4" stroke-linecap="round" />
              <!-- 鼻子（带一点高光）与嘴：微笑 / 加深微笑（期待）/ 张嘴（生气） -->
              <ellipse cx="62" cy="45.5" rx="3.8" ry="2.8" fill="#6b3d1e" />
              <circle cx="60.8" cy="44.4" r="0.9" fill="#fff" opacity="0.5" />
              <path class="mouth-smile" d="M54.5 51.5 Q62 58 69.5 51.5" stroke="#4a3f55" stroke-width="2.2" stroke-linecap="round" fill="none" />
              <path class="mouth-smile-big" d="M52.5 50.5 Q62 60.5 71.5 50.5" stroke="#4a3f55" stroke-width="2.4" stroke-linecap="round" fill="none" />
              <g class="mouth-open">
                <ellipse cx="62" cy="55" rx="6" ry="5" fill="#b03060" />
                <ellipse cx="62" cy="57.4" rx="3.5" ry="2.3" fill="#ff8fab" />
              </g>
            </g>
          </svg>
        </div>
        <div class="big-buttons">
          <button type="button" class="big-btn share-btn" id="goShareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4" />
              <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" />
            </svg>
            <span class="big-title">我有票据要分享</span>
            <span class="big-sub">把票据文件传上来，让它跳进公共票据池～</span>
          </button>
          <button type="button" class="big-btn need-btn" id="goNeedBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <span class="big-title">我想领点票据</span>
            <span class="big-sub">智能匹配或慢慢挑，票据乖乖飞进邮箱～</span>
          </button>
        </div>
        <p class="home-stats" id="homeStats">&nbsp;</p>
      </div>
    </section>

    <!-- 视图 2：分享页 -->
    <section id="view-share" class="view" hidden>
      <h2 class="view-title">来分享票据咯~</h2>
      <form id="shareForm" class="card form-card">
        <div class="field">
          <span class="field-label">票据文件 <em>*</em></span>
          <label class="file-picker" id="filePicker" for="fileInput">
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.pdf" hidden />
            <span class="file-text" id="fileText">点一下挑票据文件呀，拖进来也行（jpg / png / webp / pdf，10MB 以内哦）</span>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">票据金额 <em>*</em></span>
            <input type="number" id="shareAmount" min="0.01" step="0.01" placeholder="比如 500" required />
          </label>
          <label class="field">
            <span class="field-label">票据类型 <em>*</em></span>
            <select id="shareType"></select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">开票年月 <em>*</em></span>
            <input type="month" id="shareMonth" required />
          </label>
          <label class="field">
            <span class="field-label">您的大名</span>
            <input type="text" id="shareName" maxlength="50" placeholder="不留也行" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">悄悄话备注</span>
          <textarea id="shareRemark" maxlength="20" rows="2" placeholder="想说什么悄悄话嘛"></textarea>
          <div class="remark-counter">
            <span class="remark-tip" id="remarkTip" hidden>悄悄话太长啦，说 15 个字就好咯～</span>
            <span class="char-count" id="remarkCount">0/15</span>
          </div>
        </label>
        <button type="submit" class="primary-btn" id="shareSubmit">分享出去咯</button>
      </form>
    </section>

    <!-- 视图 3：领取页 -->
    <section id="view-claim" class="view" hidden>
      <h2 class="view-title">来领票据啦~</h2>
      <div class="subtabs" role="tablist" aria-label="领取方式">
        <button type="button" class="subtab active" id="tabManual" role="tab" aria-selected="true" aria-controls="panelManual">慢慢挑</button>
        <button type="button" class="subtab" id="tabRecommend" role="tab" aria-selected="false" aria-controls="panelRecommend">智能匹配</button>
      </div>

      <!-- 子标签 A：手动筛选 -->
      <div id="panelManual" class="panel" role="tabpanel" aria-labelledby="tabManual">
        <div class="card filter-card">
          <label class="field inline">
            <span class="field-label">金额范围</span>
            <span class="range">
              <input type="number" id="filterMin" min="0" step="1" placeholder="下限" />
              <span>—</span>
              <input type="number" id="filterMax" step="1" placeholder="上限" />
            </span>
          </label>
          <div class="field inline">
            <span class="field-label">开票年月</span>
            <input type="month" id="filterMonth" />
          </div>
          <div class="field inline">
            <span class="field-label">状态</span>
            <select id="filterStatus" required>
              <option value="">全部</option>
              <option value="available">还在池里</option>
              <option value="claimed">已被抱走</option>
            </select>
          </div>
          <div class="field inline">
            <span class="field-label">票据类型（可多选）</span>
            <div id="filterType"></div>
          </div>
          <div class="filter-actions">
            <button type="button" class="primary-btn" id="queryBtn">找找看</button>
            <button type="button" class="ghost-btn" id="resetBtn">清空重来</button>
          </div>
        </div>
        <div id="manualList" class="card-list"></div>
      </div>

      <!-- 子标签 B：智能推荐 -->
      <div id="panelRecommend" class="panel" role="tabpanel" aria-labelledby="tabRecommend" hidden>
        <div class="card filter-card">
          <label class="field inline">
            <span class="field-label">想要的金额 <span id="needAmountCap">（最多 1000）</span> <em>*</em></span>
            <input type="number" id="needAmount" min="0.01" max="1000" step="0.01" placeholder="比如 500" aria-describedby="needAmountCap" />
          </label>
          <div class="field inline">
            <span class="field-label">票据类型（可多选）</span>
            <div id="needType"></div>
          </div>
          <button type="button" class="primary-btn" id="matchBtn">帮我去匹配</button>
        </div>
        <div id="recommendResult" hidden>
          <p class="notice warn" id="recommendNotice" hidden></p>
          <div id="recommendList" class="card-list"></div>
          <div class="card summary-bar" id="recommendSummaryBar">
            <span id="recommendSummary"></span>
            <button type="button" class="primary-btn" id="claimRecommendBtn" disabled>选中的寄给我</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 领取邮箱弹窗 -->
  <div class="modal-mask" id="claimModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="claimModalTitle">
      <h3 id="claimModalTitle">把票据寄到邮箱咯</h3>
      <p class="modal-tip">票据文件打包寄给您，邮箱千万别写错哦～</p>
      <p class="modal-tip">小约定：如果这张票据后来用不上，记得再分享回池子里，让它继续帮助下一位小伙伴呀～</p>
      <label class="field">
        <span class="field-label">邮箱地址 <em>*</em></span>
        <input type="email" id="claimEmail" placeholder="比如 name@example.com，别写错哦" />
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="claimCancel">再想想</button>
        <button type="button" class="primary-btn" id="claimConfirm">寄给我</button>
      </div>
    </div>
  </div>

  <!-- 访问小暗号弹窗（服务端配置 ACCESS_TOKEN 后启用） -->
  <div class="modal-mask" id="tokenModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenModalTitle">
      <h3 id="tokenModalTitle">进门小暗号</h3>
      <p class="modal-tip">这里上了小锁呢，悄悄输入访问小暗号就能进。暗号会记在本机浏览器里，下次自动带上来哦～</p>
      <label class="field">
        <span class="field-label">访问小暗号 <em>*</em></span>
        <input type="password" id="tokenInput" placeholder="悄悄输入小暗号" />
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="tokenCancel">再想想</button>
        <button type="button" class="primary-btn" id="tokenConfirm">开门</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="shareCelebrate" class="celebrate" role="status" aria-live="polite" hidden>
    <div class="celebrate-confetti" aria-hidden="true"></div>
    <div class="celebrate-card">
      <div class="celebrate-emoji" aria-hidden="true">🎉</div>
      <p class="celebrate-text"></p>
      <p class="celebrate-sub" hidden></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
